name: word_game
description: A multiplayer word guessing game, inspired by Wordle.

publish_to: 'none'

version: 0.6.0+25

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  flutter:
    sdk: flutter

  common:
    path: ../common/
  
  bloc: ^9.0.0
  duration: ^4.0.3
  fl_chart: ^1.1.1
  flutter_bloc: ^9.0.0
  flutter_dotenv: ^6.0.0
  flutter_native_splash: ^2.2.19
  flutter_secure_storage: ^10.0.0-beta.4
  flutter_spinkit: ^5.2.2
  flutter_web_frame: ^1.0.0
  get_it: ^8.2.0
  go_router: ^14.6.0
  google_fonts: ^6.3.1
  http: ^1.5.0
  linked_scroll_controller: ^0.2.0
  material_design_icons_flutter: ^7.0.7296
  mongo_dart: ^0.10.5
  package_info_plus: ^9.0.0
  shared_preferences: ^2.0.13
  soundpool: ^2.4.1
  url_launcher: ^6.3.2
  validators: ^3.0.0
  version: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.12.0
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/words_alpha.txt
    - assets/words_common.txt
    - .env
    - assets/images/logo.png
    - assets/images/gpg_logo.png
    - assets/images/launcher_adaptive.png
    - assets/images/launcher_android.png
    - assets/images/launcher_ios.png
    - assets/images/github_white.png
    - assets/images/github_black.png
    - assets/sounds/

flutter_icons:
  image_path_android: "assets/images/launcher_android.png"
  image_path_ios: "assets/images/launcher_ios.png"
  android: true
  ios: true
  adaptive_icon_background: "#eeeeee"
  adaptive_icon_foreground: "assets/images/launcher_adaptive.png"